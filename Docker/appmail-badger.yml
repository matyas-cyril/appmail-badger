
name: ${PROJECT_NAME:-appmail-badger}

networks:

  appmail_bridge:
    name: ${COMPOSE_PROJECT_NAME}_bridge
    driver: bridge
    ipam:
      config:
        - subnet: "172.0.200.0/28" 
          gateway: "172.0.200.1"

services:

  smtp_01:
    container_name: smtp_${COMPOSE_PROJECT_NAME}_01
    build:
      context: ./DEBIAN
      dockerfile: Dockerfile
      args:
        PRIVATE_REGISTRY: ${PRIVATE_REGISTRY:-}
        TAG_DEBIAN: ${TAG_DEBIAN:-13.5-slim}
    image: ${COMPOSE_PROJECT_NAME}/smtp:${TAG_DEBIAN:-13.5-slim}
    restart: unless-stopped
    hostname: smtp-01
    ports:
      - ${EXT_SMTP:-60025}:25
      - ${EXT_SMTPS:-60587}:587
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      appmail_bridge:
        ipv4_address: 172.0.200.10

  postgres:
    container_name: postgres_${COMPOSE_PROJECT_NAME}
    build:
      context: ./POSTGRES
      dockerfile: Dockerfile
      args:
        PRIVATE_REGISTRY: ${PRIVATE_REGISTRY:-}
        TAG_POSTGRES: ${TAG_POSTGRES:-18.4-alpine}
    image: ${COMPOSE_PROJECT_NAME}/postgres:${TAG_POSTGRES:-18.4-alpine}
    restart: unless-stopped
    hostname: postgres
    # set shared memory limit pour l'utilisation Docker
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${PG_USER:-appmailBadger}
      POSTGRES_PASSWORD: ${PG_PWD:-PassAppmail}
    networks:
      appmail_bridge:
        ipv4_address: 172.0.200.2
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - Postgres:/var/lib/postgresql

  cyrus:
    container_name: cyrus_${COMPOSE_PROJECT_NAME}
    build:
      context: ./DEBIAN
      dockerfile: Dockerfile
      args:
        PRIVATE_REGISTRY: ${PRIVATE_REGISTRY:-}
        TAG_DEBIAN: ${TAG_DEBIAN:-13.5-slim}
    image: ${COMPOSE_PROJECT_NAME}/cyrus:${TAG_DEBIAN:-13.5-slim}
    restart: unless-stopped
    hostname: ${CYRUS_HOSTNAME:-cyrus-imap}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      appmail_bridge:
        ipv4_address: 172.0.200.3

  redis:
    container_name: redis_${COMPOSE_PROJECT_NAME}
    build:
      context: ./REDIS
      dockerfile: Dockerfile
      args:
        PRIVATE_REGISTRY: ${PRIVATE_REGISTRY:-}
        TAG_REDIS: ${TAG_REDIS:-8.6.4-trixie}
    image: ${COMPOSE_PROJECT_NAME}/redis:${TAG_REDIS:-8.6.4-trixie}    
    restart: unless-stopped
    hostname: redis
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      appmail_bridge:
        ipv4_address: 172.0.200.9

  webmail:
    container_name: webmail_${COMPOSE_PROJECT_NAME}
    build:
      context: ./WEBMAIL
      dockerfile: Dockerfile
      args:
        PRIVATE_REGISTRY: ${PRIVATE_REGISTRY:-}
        TAG_WEBMAIL: ${TAG_WEBMAIL:-1.6.17-apache}
    image: ${COMPOSE_PROJECT_NAME}/webmail:${TAG_WEBMAIL:-1.6.17-apache} 
    restart: unless-stopped
    hostname: webmail
    ports:
      - ${EXT_WEBMAIL:-60080}:80 
    environment:
      - ROUNDCUBEMAIL_DB_TYPE=sqlite
      - ROUNDCUBEMAIL_SKIN=elastic
      - ROUNDCUBEMAIL_DEFAULT_HOST=${CYRUS_HOSTNAME:-cyrus-imap}
      - ROUNDCUBEMAIL_DEFAULT_PORT=143
      - ROUNDCUBEMAIL_SMTP_SERVER=${CYRUS_HOSTNAME:-cyrus-imap}
      - ROUNDCUBEMAIL_SMTP_PORT=25
      - ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE=10M
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      appmail_bridge:
        ipv4_address: 172.0.200.8

  adminer:
    container_name: adminer_${COMPOSE_PROJECT_NAME}
    build:
      context: ./ADMINER
      dockerfile: Dockerfile
      args:
        PRIVATE_REGISTRY: ${PRIVATE_REGISTRY:-}
        TAG_ADMINER: ${TAG_ADMINER:-5.4.2}
    image: ${COMPOSE_PROJECT_NAME}/adminer:${TAG_ADMINER:-5.4.2} 
    restart: unless-stopped
    hostname: adminer
    ports:
      - ${EXT_ADMINER:-60081}:8080
    environment:
      - ADMINER_DEFAULT_DRIVER=pgsql
      - ADMINER_DEFAULT_SERVER=postgres
      - ADMINER_DEFAULT_USERNAME=${PG_USER:-appmailBadger}
      - ADMINER_DEFAULT_PASSWORD=${PG_PWD:-PassAppmail}
    networks:
      appmail_bridge:
        ipv4_address: 172.0.200.7
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - postgres
    configs:
      - source: adminer-index.php
        target: /var/www/html/index.php
        mode: 0755

configs:
  adminer-index.php:
    content: |
      <?php
        if(!count($$_GET)) {
          $$_POST['auth'] = [
            'server' => $$_ENV['ADMINER_DEFAULT_SERVER'],
            'driver' => $$_ENV['ADMINER_DEFAULT_DRIVER'],
            'username' => $$_ENV['ADMINER_DEFAULT_USERNAME'],
            'password' => $$_ENV['ADMINER_DEFAULT_PASSWORD'],
          ];
        }
        include './adminer.php';

volumes:
  Postgres: {}