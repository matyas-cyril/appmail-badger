# See /usr/share/postfix/main.cf.dist for a commented, more complete version

# Text that follows the 220 code in the SMTP server's greeting banner.
# You MUST specify $myhostname at the start due to an RFC requirement.
smtpd_banner = $myhostname ESMTP $mail_name (Debian)

# Notify (or not) local biff service when new mail arrives.
# Rarely used these days.
biff = no

# See http://www.postfix.org/COMPATIBILITY_README.html
compatibility_level = 3.9

# Nom de la machine
myhostname = {{ _hostname }}

# Which domain that locally-originated mail appears to come from.
# Debian policy suggests to read this value from /etc/mailname.
#XX needs a review in postinst&config
#myorigin = /etc/mailname
#myorigin = $mydomain
myorigin = $myhostname

# List of "trusted" SMTP clients (maptype:mapname allowed) that have more
# privileges than "strangers".  If mynetworks is not specified (the default),
# mynetworks_style is used to compute its value.
mynetworks_style = host
mynetworks = 127.0.0.0/8

# List of domains (maptype:mapname allowed) that this machine considers
# itself the final destination for.
mydestination = $myhostname, $myhostname.localhost, localhost, 
                /etc/postfix/domains.list

# IP protocols to use: ipv4, ipv6, or all
inet_protocols = ipv4

# Adresses réseau par lesquelles le système de messagerie reçoit les messages
inet_interfaces = all

# Uncomment the next line to generate "delayed mail" warnings
delay_warning_time = 4h

# Taille max autorisée pour un email - 15728640 = 15Mo
message_size_limit = 15728640

# Désactiver la remise locale
local_transport = error:local mail delivery is disabled

# Maximum size of a user mailbox - si local_transport
# Cette limite ne doit pas être inférieure à la taille de message_size_limit
mailbox_size_limit = $message_size_limit

# List of alias maps to use to lookup local addresses.
# Per Debian Policy it should be /etc/aliases.
alias_maps = hash:/etc/aliases

# List of alias maps to make indexes on, when running newaliases.
alias_database = hash:/etc/aliases

mailbox_command = 

# Separator between user name and address extension (user+foo@domain)
recipient_delimiter = +

# Limiter le nombre des destinatires d'un mail : défaut 1000
smtpd_recipient_limit = 100

relayhost = 
local_recipient_maps = 

default_transport = error
relay_transport = error

# Comportement lorsque l'IP n'est pas en BDD : ignore, drop, enforce
postscreen_denylist_action = drop
postscreen_access_list = permit_mynetworks, 
                         memcache:/etc/postfix/memcache_client_allow.conf,
                         reject

# Where to look for Cyrus SASL configuration files.  Upstream default is unset
# (use compiled-in SASL library default), Debian Policy says it should be
# /etc/postfix/sasl.
cyrus_sasl_config_path = /etc/postfix/sasl

smtpd_sasl_auth_enable = yes
smtpd_sasl_type = cyrus
smtpd_sasl_path = smtpd
smtpd_sasl_authenticated_header = yes
smtpd_sasl_service = smtp-mtk
broken_sasl_auth_clients = yes

# Définir la table de correspondance entre le sender et le login
smtpd_sender_login_maps = memcache:/etc/postfix/memcache_sender_login_maps.conf

smtpd_helo_required = yes
smtpd_helo_restrictions = permit_mynetworks,
                          permit_sasl_authenticated,
                          reject

smtpd_sender_restrictions = permit_mynetworks,
                            reject_authenticated_sender_login_mismatch                         

smtpd_relay_restrictions = permit_mynetworks,
                           permit_sasl_authenticated,
                           defer_unauth_destination

smtpd_data_restrictions = 
#    check_policy_service { unix:ratelimit/policy, default_action=DUNNO },

# A modifier, conf uniquement pour les tests
transport_maps = cdb:/etc/postfix/transport_to_mbx

# Proxy Cache Configuration
# Path du cache proxy
address_verify_map = proxy:btree:$data_directory/verify_cache

# Qui a le droit d'écrire dans le cache
proxy_write_maps =
    $smtp_sasl_auth_cache_name
    $lmtp_sasl_auth_cache_name
    $address_verify_map
    $postscreen_cache_map

# TLS parameters
smtpd_tls_security_level=none
#smtpd_tls_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
#smtpd_tls_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
#smtpd_tls_session_cache_database = btree:${data_directory}/smtpd_scache

#smtp_tls_CApath=/etc/ssl/certs
#smtp_tls_security_level=may
#smtp_tls_session_cache_database = btree:${data_directory}/smtp_scache

### Antivirus Amavis
content_filter = amavis:[127.0.0.1]:10024
# Délais et timeouts pour Amavis
amavis_destination_recipient_limit = 1

# Adding zolt
#smtpd_restriction_classes = zolt
#zolt = check_policy_service inet:127.0.0.1:10040

milter_protocol = 6
milter_default_action = accept
smtpd_milters = inet:localhost:11332
non_smtpd_milters=inet:localhost:11332
milter_mail_macros = i {mail_addr} {client_addr} {client_name} {auth_authen}
