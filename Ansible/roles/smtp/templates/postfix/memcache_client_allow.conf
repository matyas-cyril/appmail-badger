# Conf memcached
memcache = inet:127.0.0.1:11211
timeout = 3
max_try = 2
retry_pause = 1

# Si pas en cache alors on requête
backup = pgsql:/etc/postfix/pgsql_client_allow.conf

# Durée de vie du résultat en sec
ttl = 60

# Préfixe pour éviter les collisions avec d'autres clefs
key_format = client-connect:%s
