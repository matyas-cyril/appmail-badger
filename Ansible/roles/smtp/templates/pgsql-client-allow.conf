
hosts = inet:172.0.200.2:5432
user = Badger
password = Password
dbname = AppMail

encoding = UTF8

idle_interval = 60
retry_interval = 60

query = SELECT
            CASE
                WHEN EXISTS (
                    SELECT 1
                    FROM v_clients_allowlist
                    WHERE ip >>= '%s'::inet
                )
            THEN 'PERMIT'
            ELSE 'REJECT'
        END;

result_format = %s

