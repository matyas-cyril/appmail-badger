---
# handlers file for smtp
- name: restart_postfix
  service:
    name: postfix
    state: restarted

- name: restart_postfwd
  service:
    name: postfwd
    state: restarted

- name: restart_rspamd
  service:
    name: rspamd
    state: restarted

- name: restart_sasl
  service:
    name: saslauthd
    state: restarted

- name: restart_memcached
  service:
    name: memcached
    state: restarted