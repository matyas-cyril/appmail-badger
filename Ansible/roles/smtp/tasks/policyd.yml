---

- name: "Installer PolicyD et ses dépendances"
  apt:
    name:
      - policyd-rate-limit
      - python3-psycopg2
    state: present
    install_recommends: no
  tags:
    - install

- name: "Correction du bug de stop ou restart de Policyd"
  copy:
    src: policyd-rate-limit.init.d
    dest: /etc/init.d/policyd-rate-limit
    owner: root
    group: root
    mode: 0755
  tags:
    - always

- name: "Garder le fichier source Yaml post install comme doc"
  copy:
    src: policyd-rate-limit.yaml.source
    dest: /etc/policyd-rate-limit.yaml.source
    owner: root
    group: policyd-rate-limit
    mode: 0640
  tags:
    - always

- name: "Générer les fichiers pour Policyd Rate Limit"
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    backup: no
  with_items:
    - { src: 'policyd-rate-limit.yaml', dest: '/etc/policyd-rate-limit.yaml', owner: 'root', group: 'policyd-rate-limit', mode: '0640' }
  notify:
    restart_policyd
  tags:
    - install
    - update

- name: "Génération du cron policyd-rate-limit avec horaires aléatoires - pour être différent entre les serveurs"
  cron:
    name: "Nettoyer la table mail_count. Attention ce cron est généré via Ansible"
    # Génèrer une min rand entre 0 et 59 en utilisant le nom de la machine comme base aléatoire
    minute: "{{ (inventory_hostname | hash | int(base=16)) % 60 }}"
    # Génèrer une heure rand entre 0 et 59 en utilisant le nom de la machine comme base aléatoire
    hour: "{{ (inventory_hostname | hash | int(base=16)) % 24 }}"
    job: "/usr/bin/policyd-rate-limit --clean >/dev/null 2>&1"
    user: root
    cron_file: policyd-autoclean
  tags:
    - install

- name: "Activer et démarrer policyD Rate Limit au boot"
  service:
    name: policyd-rate-limit
    enabled: yes
    state: started
  tags:
    - install
