---

- name: "Installer Rspamd et les dépendances"
  apt:
    name:
      - rspamd
      - python3-psycopg2
    state: present
    install_recommends: no
  tags:
    - install

- name: "Générer les fichiers pour Rspamd"
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    backup: no
  with_items:
    - { src: 'rspamd/redis.conf', dest: '/etc/rspamd/local.d/redis.conf', owner: 'root', group: 'root', mode: '0644' }
    - { src: 'rspamd/worker-controller.inc', dest: '/etc/rspamd/local.d/worker-controller.inc', owner: 'root', group: 'root', mode: '0640' }
  notify:
    restart_rspamd
  tags:
    - install
    - update

- name: "Copier les fichiers pour Rspamd"
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    backup: no
  with_items:
    - { src: 'rspamd/dkim.conf', dest: '/etc/rspamd/local.d/rsdkim.conf', owner: 'root', group: 'root', mode: '0644' }
    - { src: 'rspamd/options.inc', dest: '/etc/rspamd/local.d/options.inc', owner: 'root', group: 'root', mode: '0644' }
    - { src: 'rspamd/msg_size_limit.lua', dest: '/etc/rspamd/lua.local.d/msg_size_limit.lua', owner: 'root', group: 'root', mode: '0644' }
    - { src: 'rspamd/rspamd_pg_query.py', dest: '/usr/local/bin/rspamd_pg_query.py', owner: '_rspamd', group: '_rspamd', mode: '0500' }
  notify:
    restart_rspamd
  tags:
    - install
    - update
